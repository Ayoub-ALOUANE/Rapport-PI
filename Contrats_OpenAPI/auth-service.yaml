openapi: 3.0.3
info:
  title: Fraudly — Auth Service API
  description: |
    Service d'authentification et de gestion des utilisateurs Fraudly.
    Gère l'inscription, la connexion, le renouvellement des tokens JWT
    et la gestion des profils utilisateurs.
  version: 1.0.0
  contact:
    name: P1 — Architecte Technique
    email: p1@fraudly.app

servers:
  - url: http://localhost:8081
    description: Développement local
  - url: https://api-staging.fraudly.app/auth
    description: Staging AWS
  - url: https://api.fraudly.app/auth
    description: Production AWS

tags:
  - name: Authentication
    description: Inscription, connexion et gestion des tokens JWT
  - name: Users
    description: Gestion des profils utilisateurs
  - name: Roles
    description: Gestion des rôles et permissions

paths:

  # ── AUTHENTICATION ──────────────────────────────────────────────────────────

  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Inscription d'un nouvel utilisateur
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: "etudiant@univ.ma"
              password: "SecurePass123!"
              firstName: "Yassine"
              lastName: "Bennani"
              role: "STUDENT"
      responses:
        '201':
          description: Utilisateur créé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email déjà utilisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: "EMAIL_ALREADY_EXISTS"
                message: "Un compte existe déjà avec cet email."

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Connexion et obtention des tokens JWT
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: "etudiant@univ.ma"
              password: "SecurePass123!"
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Identifiants invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: "INVALID_CREDENTIALS"
                message: "Email ou mot de passe incorrect."
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Renouvellement de l'access token via le refresh token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Nouveau access token généré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: Refresh token invalide ou expiré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: "REFRESH_TOKEN_EXPIRED"
                message: "Session expirée, veuillez vous reconnecter."

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Déconnexion et invalidation du refresh token
      operationId: logoutUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: Déconnexion réussie
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/verify-email:
    get:
      tags: [Authentication]
      summary: Vérification de l'adresse email via token
      operationId: verifyEmail
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Token de vérification envoyé par email
      responses:
        '200':
          description: Email vérifié avec succès
        '400':
          description: Token invalide ou expiré

  /api/v1/auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Demande de réinitialisation du mot de passe
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Email de réinitialisation envoyé (si le compte existe)

  /api/v1/auth/reset-password:
    post:
      tags: [Authentication]
      summary: Réinitialisation du mot de passe
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Mot de passe réinitialisé avec succès
        '400':
          description: Token invalide ou expiré

  # ── USERS ───────────────────────────────────────────────────────────────────

  /api/v1/users/me:
    get:
      tags: [Users]
      summary: Récupération du profil de l'utilisateur connecté
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profil utilisateur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags: [Users]
      summary: Mise à jour du profil de l'utilisateur connecté
      operationId: updateCurrentUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profil mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/users/{userId}:
    get:
      tags: [Users]
      summary: Récupération d'un utilisateur par ID (Admin uniquement)
      operationId: getUserById
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Profil utilisateur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Users]
      summary: Suppression d'un utilisateur (Admin uniquement)
      operationId: deleteUser
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Utilisateur supprimé
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/users:
    get:
      tags: [Users]
      summary: Liste des utilisateurs (Admin uniquement)
      operationId: listUsers
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/UserRole'
        - name: search
          in: query
          schema:
            type: string
          description: Recherche par nom ou email
      responses:
        '200':
          description: Liste paginée des utilisateurs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedUsers'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ── INTERNAL ─────────────────────────────────────────────────────────────────

  /internal/v1/auth/validate-token:
    post:
      tags: [Authentication]
      summary: Validation d'un token JWT (usage interne microservices)
      operationId: validateToken
      description: |
        Endpoint interne utilisé par les autres microservices pour valider
        un token JWT. Non exposé publiquement via l'API Gateway.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Token valide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenValidationResponse'
        '401':
          description: Token invalide ou expiré

components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token JWT (durée de vie 15 minutes)

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100

  schemas:

    UserRole:
      type: string
      enum: [STUDENT, TEACHER, ADMIN]
      description: Rôle de l'utilisateur dans la plateforme

    RegisterRequest:
      type: object
      required: [email, password, firstName, lastName, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: Doit contenir majuscule, chiffre et caractère spécial
        firstName:
          type: string
          minLength: 2
          maxLength: 100
        lastName:
          type: string
          minLength: 2
          maxLength: 100
        role:
          $ref: '#/components/schemas/UserRole'

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 8

    TokenPair:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token (expire dans 15 minutes)
        refreshToken:
          type: string
          description: JWT refresh token (expire dans 7 jours)
        tokenType:
          type: string
          default: Bearer
        expiresIn:
          type: integer
          description: Durée de vie de l'access token en secondes
          example: 900

    AuthResponse:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          properties:
            user:
              $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        avatarUrl:
          type: string
          format: uri
          nullable: true

    UpdateProfileRequest:
      type: object
      properties:
        firstName:
          type: string
          minLength: 2
          maxLength: 100
        lastName:
          type: string
          minLength: 2
          maxLength: 100
        avatarUrl:
          type: string
          format: uri

    TokenValidationResponse:
      type: object
      properties:
        valid:
          type: boolean
        userId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/UserRole'
        email:
          type: string
          format: email

    PagedUsers:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserProfile'
        totalElements:
          type: integer
        totalPages:
          type: integer
        page:
          type: integer
        size:
          type: integer

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
        timestamp:
          type: string
          format: date-time

  responses:
    BadRequest:
      description: Requête invalide (validation échouée)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Token JWT manquant ou invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Droits insuffisants pour cette opération
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
